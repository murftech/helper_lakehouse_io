[project]
name = "lakehouse_io"
version = "0.1.0"
description = "engine read/write helpers (pyarrow, pyiceberg, sparkiceberg, sparkdelta, deltalake) + shared schema guards"
requires-python = ">=3.12"
dependencies = []
# just the write-path functions - pyarrow/pyspark/pyiceberg/deltalake come from
# whatever project installs this, not from here (same convention as sparkutils).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse_io"]
